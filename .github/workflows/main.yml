name: Create Velopack Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-pack:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: NativeChatClient/package-lock.json

      - name: Ensure WebView2 runtime for window checks
        run: |
          $taskInstaller = Start-Process -FilePath .\TransparentTwitchChatWPF\MicrosoftEdgeWebview2Setup.exe -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
          if ($taskInstaller.ExitCode -ne 0) { Write-Warning "WebView2 bootstrapper returned $($taskInstaller.ExitCode); checking installed runtime during verification." }

      - name: Build, verify, and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $taskVersion = $env:RELEASE_TAG.Substring(1)
          .\publish.ps1 -Version $taskVersion

      - name: Publish release with Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $taskVersion = $env:RELEASE_TAG.Substring(1)
          $taskAssets = Get-ChildItem -LiteralPath "artifacts\packages-$taskVersion" -File | Select-Object -ExpandProperty FullName
          gh release create $env:RELEASE_TAG @taskAssets --verify-tag --title "v$taskVersion - Optional always on top" --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

      - name: Retain validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-behavior-results
          path: artifacts/verification-results.txt
          if-no-files-found: ignore
